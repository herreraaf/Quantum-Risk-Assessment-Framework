# SPDX-License-Identifier: CC0-1.0
extends: eddsa
mechanism: "Edwards-curve Digital Signature Algorithm (EdDSA)"
vulnerabilityProfile: "Immune to nonce-reuse and many side-channel timing attacks."

variants:
  - id: ed25519
    name: ed25519
    iana_id: "0x0018"
    oid: 1.3.101.112
    securityLevel: 128
    q_p: 0.75
    internal_hash: "shax:sha-512"
    note: "High performance, small signatures (64 bytes). Standard for TLS 1.3 and SSH."

  - id: ed448
    name: ed448
    oid: 1.3.101.113
    securityLevel: 224
    q_p: 0.5
    internal_hash: "shax:shake256"
    note: "Very high security; significantly slower than Ed25519. Used in specialized environments."
  
  