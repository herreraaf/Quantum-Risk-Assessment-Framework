    name: aes-128
    securityLevel: 128
    oid: 2.16.840.1.101.3.4.1.2 
    nistsecuritycategory: 1
    q_p : 0.5 

  - id: aes-192
    name: aes-192
    securityLevel: 192
    oid: 2.16.840.1.101.3.4.1.22
    nistsecuritycategory: 3
    q_p : 0.25 

  - id: aes-256
    name: aes-256
    securityLevel: 256
