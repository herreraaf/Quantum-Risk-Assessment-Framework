# IANA Registry Mappings for TLS 1.3 and TLCP Handshake Analysis
# File Location: yaml/standard/iana_hex_mapping.yaml

cipher_suites:
  "0x1301": "TLS_AES_128_GCM_SHA256"
  "0x1302": "TLS_AES_256_GCM_SHA384"
  "0x1303": "TLS_CHACHA20_POLY1305_SHA256"
  "0xe013": "ECC_SM4_CBC_SM3" # TLCP Standard
  "0xc02b": "TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256"
  "0xc02f": "TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256"

supported_groups:
  # Elliptic Curve Groups (ECDH)
  "0x0017": "secp256r1"
  "0x0018": "secp384r1"
  "0x0019": "secp521r1"
  "0x001d": "x25519"
  "0x001e": "x448"
  # Finite Field Diffie-Hellman Groups (FFDHE)
  "0x0100": "ffdhe2048"
  "0x0101": "ffdhe3072"
  "0x0102": "ffdhe4096"
  "0x0103": "ffdhe6144"
  "0x0104": "ffdhe8192"
  # TLCP Specific
  "sm2": "SM2 (Fixed)"

signature_algorithms:
  # RSA Based
  "0x0401": "RSA-2048 (rsa_pkcs1_sha256)"
  #"0x0804": "RSA-2048 (rsa_pss_rsae_sha256)"
  # ECDSA Based
  "0x0403": "ECDSA-P256 (ecdsa_secp256r1_sha256)"
  "0x0503": "ECDSA-P384 (ecdsa_secp384r1_sha384)"
  "0x0603": "ECDSA-P521 (ecdsa_secp521r1_sha512)"
  # Edwards-curve (EdDSA)
  "0x0807": "Ed25519"
  "0x0808": "Ed448"
  # TLCP Specific
  #"sm2-with-sm3": "SM2-with-SM3"
  